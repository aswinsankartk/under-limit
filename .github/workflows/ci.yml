name: Under Limit CI

on:
  push:
    branches:
      - main
      - feature/testing-setup
  pull-request:
    branches:
      - main

jobs:
  quality-checks:
    name: Test, Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
      - run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Run ESLint
        run: npm run lint

      - name: Build application
        run: npm run build
